name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Init project
        run: |
          mkdir twa && cd twa
          printf '%s\n' "y" | bubblewrap init --manifest=https://beautiful-cuchufli-e29f00.netlify.app/manifest.json || true

      - name: Build APK
        run: |
          cd twa
          bubblewrap build --skipPwaValidation

      - uses: actions/upload-artifact@v4
        with:
          name: karenda-apk
          path: twa/*.apk
