name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Install Android SDK (Bubblewrap layout)
        run: |
          mkdir -p $HOME/android-sdk
          curl -sSL -o cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline.zip -d cmdtmp
          cp -r cmdtmp/cmdline-tools/* $HOME/android-sdk/
          yes | $HOME/android-sdk/bin/sdkmanager --licenses --sdk_root=$HOME/android-sdk > /dev/null || true
          $HOME/android-sdk/bin/sdkmanager --install "build-tools;36.1.0" "build-tools;35.0.0" "platform-tools" "platforms;android-36" "platforms;android-35" --sdk_root=$HOME/android-sdk > /dev/null
          ls $HOME/android-sdk $HOME/android-sdk/platforms

      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          python3 - <<'PY'
          import json, os
          cfg = {"jdkPath": os.environ["JAVA_HOME"], "androidSdkPath": os.path.expanduser("~/android-sdk")}
          json.dump(cfg, open(os.path.expanduser("~/.bubblewrap/config.json"), "w"))
          PY
          cat ~/.bubblewrap/config.json

      - name: Create signing key
        run: keytool -genkeypair -v -keystore android.keystore -alias karenda -keyalg RSA -keysize 2048 -validity 10000 -storepass karenda123 -keypass karenda123 -dname "CN=Karenda, O=Karenda, C=MA"

      - name: Write TWA config
        run: |
          mkdir twa
          python3 - <<'PY'
          import json
          h = "beautiful-cuchufli-e29f00.netlify.app"
          cfg = {
            "packageId": "app.netlify.karenda.twa",
            "host": h,
            "name": "Karenda Tracker",
            "launcherName": "Karenda",
            "display": "standalone",
            "themeColor": "#0F2D27",
            "themeColorDark": "#0F2D27",
            "navigationColor": "#0F2D27",
            "navigationColorDark": "#0F2D27",
            "navigationDividerColor": "#0F2D27",
            "navigationDividerColorDark": "#0F2D27",
            "backgroundColor": "#0F2D27",
            "enableNotifications": False,
            "startUrl": "/",
            "iconUrl": "https://" + h + "/icons/icon-512.png",
            "maskableIconUrl": "https://" + h + "/icons/icon-maskable-512.png",
            "webManifestUrl": "https://" + h + "/manifest.webmanifest",
            "appVersion": "1",
            "appVersionCode": 1,
            "signingKey": {"path": "../android.keystore", "alias": "karenda"},
            "orientation": "portrait",
            "fallbackType": "customtabs",
            "features": {},
            "splashScreenFadeOutDuration": 300,
            "enableSiteSettingsShortcut": True,
            "isChromeOSOnly": False,
            "isMetaQuest": False,
            "fullScopeUrl": "https://" + h + "/",
            "minSdkVersion": 24,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli"
          }
          json.dump(cfg, open("twa/twa-manifest.json", "w"), indent=2)
          PY
          cat twa/twa-manifest.json

      - name: Generate Android project
        working-directory: twa
        run: bubblewrap update --skipVersionUpgrade

      - name: Upgrade Android Gradle Plugin to 8.10.1
        working-directory: twa
        run: |
          sed -i 's/com.android.tools.build:gradle:8.9.1/com.android.tools.build:gradle:8.10.1/' build.gradle
          grep -n "com.android.tools.build" build.gradle
          grep -n "SdkVersion" app/build.gradle
          cat gradle/wrapper/gradle-wrapper.properties | grep distributionUrl

      - name: Build APK
        working-directory: twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: karenda123
          BUBBLEWRAP_KEY_PASSWORD: karenda123
        run: bubblewrap build --skipPwaValidation

      - name: List outputs
        run: ls -la twa/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: karenda-apk
          path: twa/app-release-signed.apk
